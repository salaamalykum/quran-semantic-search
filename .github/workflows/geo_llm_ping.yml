name: Sitemap indexing ping
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  ping_search_engines:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Google sitemap endpoint
        run: |
          curl -sS "https://www.google.com/ping?sitemap=https://salaamalykum.com/cn/qurancn/pc/sitemap.xml" || echo "Ping triggered"
      - name: Ping Bing sitemap endpoint
        run: |
          curl -sS "https://www.bing.com/ping?sitemap=https://salaamalykum.com/cn/qurancn/pc/sitemap.xml" || echo "Ping triggered"
      - name: Log result
        run: |
          echo "Sitemap indexing ping workflow completed."
